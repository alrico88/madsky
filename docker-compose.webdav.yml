services:
  webdav:
    image: bytemark/webdav
    container_name: madsky-webdav
    restart: unless-stopped
    environment:
      AUTH_TYPE: Basic
      USERNAME: "madsky"
      PASSWORD: "madsky"
      ANONYMOUS_METHODS: GET,HEAD,OPTIONS,PROPFIND
    ports:
      - "8081:80"
    volumes:
      - ./_webdav-data:/var/lib/dav
